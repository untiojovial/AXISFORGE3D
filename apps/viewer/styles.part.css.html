<title>AXISFORGE Grasp Bench</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  /* Layout: a machine-tool panel. Controls in a left rail, the cell on the
     right with its readouts underneath; on a phone the cell comes first. */
  :root {
    --ground: #e9ecef; --panel: #f6f8f9; --sunken: #dce1e6;
    --ink: #131a20; --muted: #5a6773; --faint: #7f8d99;
    --rule: #ccd4da; --rule-soft: #dfe5e9;
    --accent: #0d6b73; --accent-soft: #0d6b731a; --accent-ink: #ffffff;
    --ok: #2b7a51; --warn: #8f6004; --alert: #ab3126;
    --stage: #dde2e6; --floor: #cdd4da; --grid: #9aa6b0;
    --shadow: 0 1px 2px #131a2014;
    --step-0: 0.75rem; --step-1: 0.8125rem; --step-2: 0.9375rem; --step-3: 1.125rem; --step-4: 1.5rem;
    --ui: "Archivo", ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #12161a; --panel: #1a2026; --sunken: #0c1013;
      --ink: #e4eaef; --muted: #95a2ae; --faint: #6e7c88;
      --rule: #2a333b; --rule-soft: #222a31;
      --accent: #46b3bd; --accent-soft: #46b3bd1f; --accent-ink: #07191b;
      --ok: #55b585; --warn: #d59f42; --alert: #e46f62;
      --stage: #14191d; --floor: #1c2329; --grid: #3a454e;
      --shadow: 0 1px 2px #00000040; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ground: #12161a; --panel: #1a2026; --sunken: #0c1013;
    --ink: #e4eaef; --muted: #95a2ae; --faint: #6e7c88;
    --rule: #2a333b; --rule-soft: #222a31;
    --accent: #46b3bd; --accent-soft: #46b3bd1f; --accent-ink: #07191b;
    --ok: #55b585; --warn: #d59f42; --alert: #e46f62;
    --stage: #14191d; --floor: #1c2329; --grid: #3a454e;
    --shadow: 0 1px 2px #00000040; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--ui); font-size: var(--step-2); line-height: 1.45; -webkit-font-smoothing: antialiased; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .shell { max-width: 1320px; margin: 0 auto; padding-block: 20px 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; }
  .masthead { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-bottom: 12px; border-bottom: 1px solid var(--rule); }
  .wordmark { font-size: var(--step-4); font-weight: 700; letter-spacing: -0.015em; margin: 0; text-wrap: balance; }
  .wordmark span { color: var(--accent); }
  .strapline { margin: 2px 0 0; color: var(--muted); font-size: var(--step-1); max-width: 62ch; }
  .provenance { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: var(--step-0); color: var(--muted); border: 1px solid var(--rule); border-radius: 2px; padding: 5px 9px; background: var(--panel); }
  .provenance b { color: var(--ink); font-weight: 600; }
  .pulse { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); flex: none; }
  .bench { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: 14px; align-items: start; }
  .rail, .stage { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .module { background: var(--panel); border: 1px solid var(--rule); border-radius: 3px; box-shadow: var(--shadow); min-width: 0; }
  .module__head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--rule-soft); }
  .module__title { margin: 0; font-size: var(--step-0); font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .module__note { font-family: var(--mono); font-size: var(--step-0); color: var(--faint); }
  .module__body { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn { font: inherit; font-size: var(--step-1); padding: 6px 11px; border: 1px solid var(--rule); background: var(--panel); color: var(--ink); border-radius: 2px; cursor: pointer; }
  .btn:hover { border-color: var(--accent); }
  .btn--primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .field--wide { grid-column: 1 / -1; }
  .field label { font-size: var(--step-0); letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); }
  .field input, .field select { font-family: var(--mono); font-size: var(--step-1); padding: 5px 7px; border: 1px solid var(--rule); border-radius: 2px; background: var(--ground); color: var(--ink); min-width: 0; width: 100%; }
  .verdict { padding: 9px 11px; border-left: 3px solid var(--rule); background: var(--ground); font-size: var(--step-1); }
  .verdict--ok { border-left-color: var(--ok); } .verdict--warn { border-left-color: var(--warn); } .verdict--alert { border-left-color: var(--alert); }
  .verdict__head { font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; font-size: var(--step-0); margin-bottom: 3px; }
  .verdict--ok .verdict__head { color: var(--ok); } .verdict--warn .verdict__head { color: var(--warn); } .verdict--alert .verdict__head { color: var(--alert); }
  .verdict__detail { color: var(--muted); }
  .plans { display: flex; flex-direction: column; gap: 6px; }
  .plan { text-align: left; font: inherit; color: var(--ink); background: var(--ground); border: 1px solid var(--rule); border-radius: 2px; padding: 8px 10px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; }
  .plan[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .plan__name { font-weight: 600; font-size: var(--step-1); }
  .plan__metrics { display: flex; flex-wrap: wrap; gap: 2px 12px; font-family: var(--mono); font-size: var(--step-0); font-variant-numeric: tabular-nums; color: var(--muted); }
  .plan__metrics b { color: var(--ink); font-weight: 500; }
  .plan__label { font-family: var(--mono); font-size: var(--step-0); color: var(--faint); overflow-wrap: anywhere; }
  .reasons { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: var(--step-1); }
  .reasons li { display: flex; justify-content: space-between; gap: 10px; }
  .reasons span:last-child { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--muted); }
  details { font-size: var(--step-1); } summary { cursor: pointer; color: var(--muted); }
  .rejlist { margin: 6px 0 0; padding: 0; list-style: none; max-height: 220px; overflow: auto; font-family: var(--mono); font-size: var(--step-0); color: var(--muted); display: flex; flex-direction: column; gap: 5px; }
  .rejlist b { color: var(--ink); font-weight: 500; }
  .axes { display: flex; flex-direction: column; gap: 9px; }
  .axis__top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .axis__name { font-family: var(--mono); font-size: var(--step-1); color: var(--muted); }
  .axis__value { font-family: var(--mono); font-size: var(--step-1); font-variant-numeric: tabular-nums; font-weight: 500; }
  .axis--out .axis__value { color: var(--alert); }
  .axis input { width: 100%; margin: 0; accent-color: var(--accent); }
  .axis__limits { display: flex; justify-content: space-between; font-family: var(--mono); font-size: var(--step-0); font-variant-numeric: tabular-nums; color: var(--faint); }
  .axes__sep { font-size: var(--step-0); letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); border-top: 1px solid var(--rule-soft); padding-top: 8px; }
  .viewport { position: relative; aspect-ratio: 16 / 10.5; max-width: 100%; min-height: 300px; border: 1px solid var(--rule); border-radius: 3px; overflow: hidden; background: var(--stage); box-shadow: var(--shadow); touch-action: none; }
  .viewport canvas { display: block; width: 100%; height: 100%; }
  .viewport__hint { position: absolute; left: 10px; bottom: 8px; font-family: var(--mono); font-size: var(--step-0); color: var(--muted); background: var(--panel); border: 1px solid var(--rule); padding: 3px 7px; border-radius: 2px; pointer-events: none; }
  .viewport__flag { position: absolute; right: 10px; top: 8px; max-width: calc(100% - 20px); z-index: 1; font-family: var(--mono); font-size: var(--step-0); font-weight: 600; letter-spacing: 0.04em; padding: 3px 8px; border-radius: 2px; border: 1px solid; background: var(--panel); }
  .flag--ok { color: var(--ok); border-color: var(--ok); } .flag--alert { color: var(--alert); border-color: var(--alert); }
  .phases { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .phases__label { font-family: var(--mono); font-size: var(--step-0); color: var(--faint); margin-left: auto; }
  .readouts { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); background: var(--panel); border: 1px solid var(--rule); border-radius: 3px; overflow: hidden; }
  .gauge { padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; box-shadow: 1px 0 0 var(--rule-soft), 0 1px 0 var(--rule-soft); }
  .gauge__label { font-size: var(--step-0); letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); }
  .gauge__label--symbol { text-transform: none; letter-spacing: 0.04em; }
  .gauge__value { font-family: var(--mono); font-size: var(--step-3); font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .gauge__unit { font-size: var(--step-1); color: var(--muted); }
  .gauge__sub { font-family: var(--mono); font-size: var(--step-0); color: var(--faint); overflow-wrap: anywhere; }
  .gauge--ok .gauge__value { color: var(--ok); } .gauge--warn .gauge__value { color: var(--warn); } .gauge--alert .gauge__value { color: var(--alert); }
  .footing { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 12px; border-top: 1px solid var(--rule); font-size: var(--step-0); color: var(--faint); }
  .footing span { max-width: 78ch; } .footing strong { color: var(--muted); font-weight: 500; }
  .fallback { padding: 16px; border: 1px solid var(--alert); border-radius: 3px; background: var(--panel); }
  @media (max-width: 900px) { .bench { grid-template-columns: minmax(0, 1fr); } .stage { order: -1; } }
  .viewbar { position: absolute; left: 10px; top: 8px; display: flex; gap: 4px; flex-wrap: wrap; max-width: calc(100% - 130px); }
  .chip { font: inherit; font-family: var(--mono); font-size: var(--step-0); padding: 3px 8px; border: 1px solid var(--rule); background: var(--panel); color: var(--muted); border-radius: 2px; cursor: pointer; }
  .chip:hover { border-color: var(--accent); color: var(--ink); }
  .chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--panel); font-weight: 600; }
  .chip--sep { margin-left: 8px; }
  .legend { position: absolute; right: 10px; bottom: 8px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; max-width: calc(100% - 20px); font-family: var(--mono); font-size: var(--step-0); color: var(--muted); background: var(--panel); border: 1px solid var(--rule); padding: 3px 8px; border-radius: 2px; pointer-events: none; }
  .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
  .check { display: flex; align-items: center; gap: 7px; font-size: var(--step-1); }
  .check input { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
  .hint { font-size: var(--step-0); color: var(--faint); margin: 0; }
  .exts { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; font-size: var(--step-1); }
  .exts b { font-family: var(--mono); font-weight: 500; }
  .exts span { display: block; color: var(--muted); font-size: var(--step-0); }
  .tag { font-family: var(--mono); font-size: var(--step-0); color: var(--faint); border: 1px solid var(--rule); border-radius: 2px; padding: 0 5px; margin-left: 6px; }
  .pill { display: inline-block; font-family: var(--mono); font-size: var(--step-0); font-weight: 600; padding: 0 6px; border-radius: 2px; border: 1px solid; }
  .pill--ok { color: var(--ok); border-color: var(--ok); } .pill--warn { color: var(--warn); border-color: var(--warn); }
  details.module > summary { list-style: none; cursor: pointer; }
  details.module > summary::-webkit-details-marker { display: none; }
  details.module > summary .module__note::after { content: " \25BE"; }
  details.module:not([open]) > summary { border-bottom: 0; }
  .viewport__hint { max-width: calc(100% - 20px); }
  @media (max-width: 1100px) { .viewport__hint { display: none; } }
  @media (max-width: 560px) { .legend { display: none; } .viewbar { max-width: calc(100% - 20px); top: 36px; } }
</style>
