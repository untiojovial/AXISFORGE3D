name: AxisForgeBO
on: [push, pull_request]
jobs:
  scientific-tests:
    runs-on: ubuntu-latest
    env:
      PIP_CONSTRAINT: ${{ github.workspace }}/docs/axisforge-bo/constraints-linux-cpu-py312.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'torch==2.9.1+cpu' --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - run: python -m pip install '.[test,research,mcmc,vision,grasping]'
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo build --locked -p axisforge-wasm --profile wasm-release --target wasm32-unknown-unknown
      - run: OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 python -m coverage run -m pytest
      - run: python -m coverage report --show-missing
      - run: python -m coverage json -o /tmp/axisforge-coverage.json
      - name: Verify independent line and branch thresholds
        run: |
          python - <<'PY'
          import json
          with open('/tmp/axisforge-coverage.json') as result:
              totals = json.load(result)['totals']
          assert totals['covered_lines'] / totals['num_statements'] >= .90
          assert totals['covered_branches'] / totals['num_branches'] >= .85
          PY
